<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Architecture of cost-weighted-thresholds"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="480.0" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b1f23">One ranking, five score sets, five different bills</text><rect x="24" y="150" width="190" height="70" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="119.0" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">true probabilities</text><text x="119.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">and the labels</text><text x="119.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">drawn from them</text><rect x="260" y="150" width="210" height="70" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="365.0" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">strictly monotone|distortion</text><text x="365.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">cannot reorder anything</text><line x1="214" y1="185" x2="260" y2="185" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="58" width="230" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="655.0" y="78" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">rank the rows</text><text x="655.0" y="96" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">AUC, ROC, precision at k</text><rect x="800" y="58" width="136" height="56" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/><text x="868.0" y="78" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">0.706592</text><text x="868.0" y="96" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">identical, all five</text><line x1="470" y1="170" x2="540" y2="110" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="770" y1="86" x2="800" y2="86" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="150" width="230" height="56" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="655.0" y="182.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">compare mean score|against the base rate</text><rect x="800" y="150" width="136" height="56" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="868.0" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">the gap</text><text x="868.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">moves with the</text><text x="868.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">distortion</text><line x1="470" y1="185" x2="540" y2="182" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="770" y1="178" x2="800" y2="178" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="262" width="230" height="70" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="655.0" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">threshold at C_fp/(C_fp+C_fn)</text><text x="655.0" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">then sweep for the best</text><text x="655.0" y="314" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">threshold these scores allow</text><rect x="800" y="262" width="136" height="70" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="868.0" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">regret</text><text x="868.0" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">0.0015 to 1.0397</text><text x="868.0" y="314" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">a factor of 683</text><line x1="470" y1="200" x2="540" y2="290" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="770" y1="297" x2="800" y2="297" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="655" y="356" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">the only reading that prices a decision</text><rect x="130" y="400" width="700" height="66" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="480.0" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">a ranking metric is invariant to exactly the thing that sets the bill</text><text x="480.0" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">three of five distortions produce a model that costs more to act on than no model at all</text><line x1="868" y1="114" x2="700" y2="400" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="868" y1="332" x2="480" y2="400" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/></svg>
